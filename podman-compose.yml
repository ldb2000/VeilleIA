version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veillia-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/sql_app.db
      # Reddit (signaux communautaires de la veille) : à définir dans backend/.env, lu via env_file.
      # REDDIT_ENABLED (false par défaut), REDDIT_SUBREDDITS, REDDIT_MAX_POSTS (15), REDDIT_MAX_POSTS_PER_SUB (5),
      # REDDIT_USER_AGENT, REDDIT_TIMEOUT_SECONDS (10). Flux RSS public, sans compte Reddit ; une requête par veille.
      # Voir docs/CONFIGURATION.md#reddit.
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
      # Authentification Codex (`codex login` sur l'hôte) ; en écriture pour le rafraîchissement du jeton.
      - ${HOME}/.codex:/root/.codex
      - ${HOME}/.gemini:/root/.gemini:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veillia-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./backend/.env
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
